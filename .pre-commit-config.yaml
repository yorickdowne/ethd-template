---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: check-ast
      - id: debug-statements
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
      - id: check-case-conflict
      - id: requirements-txt-fixer
      - id: check-toml

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95
    hooks:
      - id: shellcheck

  # Spelling (nice quality-of-life)
  - repo: https://github.com/codespell-project/codespell
    rev: 63c8f8312b7559622c0d82815639671ae42132ac
    hooks:
      - id: codespell

  # Dockerfiles
  # Disabled bcs macOS Docker might not be installed
  #- repo: https://github.com/hadolint/hadolint
  #  rev: 1d901b9c0b0d0445d19b1a9128d89fa55bb4604e
  #  hooks:
  #    - id: hadolint-docker

  # YAML style (beyond syntax)
  - repo: https://github.com/adrienverge/yamllint
    rev: 79a6b2b1392eaf49cdd32ac4f14be1a809bbd8f7
    hooks:
      - id: yamllint
        args:
          - -d
          - >
            {extends: default, rules: {line-length: {max: 120},document-start: disable,truthy: disable}}
